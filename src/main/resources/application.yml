spring:
  datasource:
    url: jdbc:h2:file:./data/app
    driver-class-name: org.h2.Driver
    username: sa

onno:
  auth:
    session:
      remember-me:
        allow-ephemeral-key: true

    users:
      - username: admin
        password: admin
        roles: [ADMIN]

org:
  jobrunr:
    background-job-server:
      enabled: true
      poll-interval-in-seconds: 5